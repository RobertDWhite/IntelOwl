name: Security nginx candidate
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact source commit to build
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  nginx:
    if: github.repository == 'RobertDWhite/IntelOwl'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build exact candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile_nginx
          platforms: linux/amd64
          push: true
          tags: ghcr.io/robertdwhite/intelowl-nginx:security-${{ inputs.ref }}
          provenance: true
